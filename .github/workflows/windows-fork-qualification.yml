name: Windows fork qualification

on:
  push:
    branches: [qualification/windows-package]

permissions:
  contents: read

jobs:
  package:
    if: github.repository == 'InTheta/t3code'
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      T3_QUALIFICATION_SHA: 18898f130cc48632735750e26acc090f159036af
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: 18898f130cc48632735750e26acc090f159036af
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...
      - name: Verify source and prepare the MSVC target
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne $env:T3_QUALIFICATION_SHA) {
            throw "Unexpected qualification source commit"
          }
          rustup target add x86_64-pc-windows-msvc
      - name: Build the Windows x64 installer
        shell: pwsh
        run: |
          vp run dist:desktop:win:x64 --output-dir "$env:RUNNER_TEMP/t3-windows-qualification"
      - name: Record installer identity
        shell: pwsh
        run: |
          $output = "$env:RUNNER_TEMP/t3-windows-qualification"
          $installer = @(Get-ChildItem -LiteralPath $output -Filter '*.exe' -File)
          if ($installer.Count -ne 1) { throw "Expected one Windows installer" }
          $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $installer[0].FullName
          "$($hash.Hash.ToLowerInvariant())  $($installer[0].Name)" | Set-Content "$output/SHA256SUMS.txt"
          $env:T3_QUALIFICATION_SHA | Set-Content "$output/SOURCE-SHA.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: t3-windows-x64-qualification
          path: |
            ${{ runner.temp }}/t3-windows-qualification/*.exe
            ${{ runner.temp }}/t3-windows-qualification/SHA256SUMS.txt
            ${{ runner.temp }}/t3-windows-qualification/SOURCE-SHA.txt
          if-no-files-found: error
          retention-days: 7