name: Beta macOS and Ubuntu qualification
on:
  push:
    branches: [qualification/beta-platforms-20261124a]
permissions:
  contents: read
jobs:
  package:
    if: github.repository == 'InTheta/t3code'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact: ubuntu-x64
            task: dist:desktop:linux
            extension: AppImage
          - runner: macos-15
            artifact: macos-arm64
            task: dist:desktop:dmg:arm64
            extension: dmg
    env:
      T3_QUALIFICATION_SHA: b70be04190ecd3c8229d094f569c4343b7834fdc
      TASK: ${{ matrix.task }}
      EXTENSION: ${{ matrix.extension }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Fetch the pinned public source
        shell: bash
        run: |
          set -euo pipefail
          git init
          git fetch --no-tags --depth=1 https://github.com/InTheta/t3code.git "$T3_QUALIFICATION_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$T3_QUALIFICATION_SHA"
      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...
      - name: Install Ubuntu packaging libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config imagemagick libgtk-3-0t64 libnss3 libasound2t64 libgbm1
      - name: Package desktop application
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/beta-platform"
          vp run "$TASK" --output-dir "$out"
          cd "$out"
          shasum -a 256 *."$EXTENSION" > SHA256SUMS.txt
          printf '%s\n' "$T3_QUALIFICATION_SHA" > SOURCE-SHA.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: t3-${{ matrix.artifact }}-qualification
          path: |
            ${{ runner.temp }}/beta-platform/*.${{ matrix.extension }}
            ${{ runner.temp }}/beta-platform/SHA256SUMS.txt
            ${{ runner.temp }}/beta-platform/SOURCE-SHA.txt
          if-no-files-found: error
          retention-days: 7
